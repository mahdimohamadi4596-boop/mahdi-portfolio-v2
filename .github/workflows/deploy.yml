name: Deploy website to hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.mahdi-mohammadi.ir
          username: github-deploy@mahdi-mohammadi.ir
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml